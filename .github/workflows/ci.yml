name: Data Pipeline CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: "SQL Lint & Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install sqlfluff dbt-core dbt-duckdb

      - name: dbt Compile
        run: |
          dbt compile --profiles-dir ./ci --target ci

      - name: SQLFluff Lint
        run: |
          sqlfluff lint models/ --dialect duckdb --ignore parsing || 