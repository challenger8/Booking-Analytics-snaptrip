name: Data Pipeline CD

on:
  push:
    branches: [main]
    paths:
      - 'models/**'
      - 'schema.yml'

jobs:
  # ============================================================
  # This CD pipeline demonstrates the production deployment flow.
  # In a real environment, this would connect to Trino/Spark.
  # For this task, we simulate deployment using DuckDB.
  # ============================================================

  deploy-staging:
    name: "Deploy to Staging (Simulated)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install dbt-core dbt-duckdb

      - name: Deploy to staging (DuckDB simulation)
        run: |
          echo "In production: dbt run --target staging (Trino/Spark)"
          echo "Simulating with DuckDB..."
          dbt seed --profiles-dir ./ci --target ci
          dbt run --profiles-dir ./ci --target ci

      - name: Run tests
        run: dbt test --profiles-dir 